name: PR Preview Build

on:
  issue_comment:
    types: [created]

concurrency:
  group: pr-preview-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: read

jobs:
  prepare:
    if: ${{ github.event.issue.pull_request }}
    uses: vaughnw128/hakoniwa/.github/workflows/pr-comment-prepare.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-body: ${{ github.event.comment.body || '' }}
      comment-author-association: ${{ github.event.comment.author_association || '' }}
      command-prefix: euclid build
      allow-forks: false
    secrets: inherit

  preview:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    uses: vaughnw128/hakoniwa/.github/workflows/pr-preview.yml@main
    with:
      pr-number: ${{ needs.prepare.outputs.pr_number }}
      head-sha: ${{ needs.prepare.outputs.head_sha }}
      language: rust
      binary-name: discsync
      dockerfile: ./Dockerfile
      build-context: .
      helm-path: ./helm
      chart-name: discsync
      helm-image-repository-key: single-container.image
      helm-image-tag-key: single-container.imageTag
    secrets: inherit
