name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read
  security-events: write

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no ci]') }}
    uses: vaughnw128/hakoniwa/.github/workflows/build-and-release-rust.yml@main
    with:
      binary-name: discsync
    secrets: inherit

  bump:
    needs: build
    if: ${{ needs.build.outputs.new_version != '' }}
    uses: vaughnw128/hakoniwa/.github/workflows/bump.yml@main
    with:
      new_version: ${{ needs.build.outputs.new_version }}
      language: rust
      helm-path: ./helm
      push-helm-oci: true
    secrets: inherit
